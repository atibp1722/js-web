<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Your Bookmarks</title>
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <main>
        <div class="outer-wrap">
            <div class="inner-wrap">
                <section class="heading">
                    <p class="title">JS Web Bookmark Manager</p>
                    <p class="subtitle">Manage all your bookamrks from one place.</p>
                </section>
                <section class="create">
                    <form class="add">
                        <input type="text" id="link" name="link" placeholder="URL" autocomplete="off">
                        <input type="text" name="title" placeholder="Title" autocomplete="off" maxlength="30">
                        <select name="category">
                            <option value="netflix">Netflix</option>
                            <option value="youtube">Youtube</option>
                            <option value="prime">Prime</option>
                            <option value="other">Others</option>
                        </select>
                        <input type="submit" value="Bookmark" id="bookmark">
                    </form>
                </section>
                <section class="bookmark">
                    <div class="category-list">
                        <span class="active">All</span>
                        <span>Netflix</span>
                        <span>Youtube</span>
                        <span>Prime</span>
                        <span>Others</span>
                    </div>
                    <div class="cards">
                        
                    </div>
                </section>
            </div>
        </div>
    </main>
</body>

<script type="module" src="./script.js"></script>
</html>
